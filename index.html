  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

; font-size:16px; letter-spacing:.3px;\">Wizard Piedade<\u002Fdiv>\n        <div style=\"font-size:11px; color:#8fa6c0; letter-spacing:1.4px; text-transform:uppercase;\">CRM Comercial<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <nav style=\"display:flex; flex-direction:column; gap:4px;\">\n      <sc-for list=\"{{ navItems }}\" as=\"nav\" hint-placeholder-count=\"4\">\n        <button sc-camel-on-click=\"{{ nav.go }}\" style=\"{{ nav.style }}\">\n          <span style=\"{{ nav.dotStyle }}\"><\u002Fspan>\n          <span style=\"flex:1; text-align:left;\">{{ nav.label }}<\u002Fspan>\n          <sc-if value=\"{{ nav.badge }}\" hint-placeholder-val=\"0\">\n            <span style=\"background:#E2231A; color:#fff; font-size:11px; font-weight:700; min-width:20px; height:20px; padding:0 6px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center;\">{{ nav.badge }}<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fnav>\n    <div style=\"margin-top:auto; padding:14px 10px; border-top:1px solid rgba(255,255,255,.1);\">\n      <div style=\"font-size:12px; color:#b9c8db; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;\">{{ userEmail }}<\u002Fdiv>\n      <div style=\"font-size:11px; color:#7d93ad; margin:2px 0 10px;\">{{ totalLeads }} leads · {{ hojeStr }}<\u002Fdiv>\n      <button sc-camel-on-click=\"{{ logout }}\" style=\"width:100%; background:rgba(255,255,255,.08); color:#cdd9e8; border:1px solid rgba(255,255,255,.15); padding:9px; border-radius:8px; font-size:12.5px; font-weight:700; cursor:pointer;\" style-hover=\"background:rgba(255,255,255,.16);\">Sair<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <!-- MAIN -->\n  <main id=\"mainCol\" style=\"flex:1; display:flex; flex-direction:column; overflow:hidden;\">\n    <header id=\"topHeader\" style=\"height:72px; flex:0 0 72px; background:#fff; border-bottom:1px solid #e2e8f0; display:flex; align-items:center; :8px;\">\n        <sc-for list=\"{{ sheet.options }}\" as=\"o\" hint-placeholder-count=\"8\">\n          <button sc-camel-on-click=\"{{ o.onPick }}\" style=\"display:flex; align-items:center; gap:12px; min-height:48px; padding:12px 14px; border-radius:11px; cursor:pointer; text-align:left; background:{{ o.bg }}; border:1px solid {{ o.border }}; font-size:14.5px; font-weight:{{ o.weight }}; color:#1a2332;\">\n            <span style=\"width:12px; height:12px; border-radius:50%; background:{{ o.cor }}; flex:0 0 auto;\"><\u002Fspan>\n            <span style=\"flex:1;\">{{ o.label }}<\u002Fspan>\n            <sc-if value=\"{{ o.current }}\" hint-placeholder-val=\"0\"><span style=\"font-size:11px; font-weight:800; color:{{ o.cor }};\">ATUAL<\u002Fspan><\u002Fsc-if>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ========== LOADING BAR ========== -->\n<sc-if value=\"{{ loading }}\" hint-placeholder-val=\"0\">\n  <div style=\"position:fixed; top:0; left:0; right:0; height:3px; background:rgba(226,35,26,.2); z-index:120; overflow:hidden;\">\n    <div style=\"position:absolute; top:0; height:100%; width:40%; background:#E2231A; animation:indet 1s linear infinite;\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ========== TOAST ========== -->\n<sc-if value=\"{{ toast }}\" hint-placeholder-val=\"0\">\n  <div style=\"position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:130; background:{{ toast.bg }}; color:#fff; padding:12px 20px; border-radius:10px; font-size:13.5px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.25); animation:slideUp .2s ease; max-width:90vw;\">{{ toast.msg }}<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst SB_URL = 'https://vrghaejieiaxxleemnbi.supabase.co';\nconst SB_KEY = 'sb_publishable_ESFW-g9mIZx6wm6XxVG85A_tP-i_Ujp';\nconst SESSION_KEY = 'wizard_crm_session';\n\nconst STATUSES = ['Novo','Contatado','Aula agendada','Compareceu','Não compareceu','Em negociação','Matriculado','Perdido'];\nconst STATUS_COLOR = { 'Novo':'#64748b','Contatado':'#2563eb','Aula agendada':'#0891b2','Compareceu':'#0d9488','Não compareceu':'#f87171','Em negociação':'#7c3aed','Matriculado':'#16a34a','Perdido':'#dc2626' };\nconst STATUS_BG = { 'Novo':'#eef1f5','Contatado':'#e8f0fe','Aula agendada':'#e0f3f8','Compareceu':'#d7f1ec','Não compareceu':'#fdecec','Em negociação':'#efe8fd','Matriculado':'#e6f6ec','Perdido':'#fdeaea' };\nconst FONTES = ['Anúncio','Instagram','Indicação','Fachada','Sponte','Site','Parceria/Escola','WhatsApp'];\nconst FONTE_COLOR = { 'Anúncio':'#0F2C4C','Instagram':'#c13584','Indicação':'#16a34a','Fachada':'#0891b2','Sponte':'#7c3aed','Site':'#2563eb','Parceria/Escola':'#ea580c','WhatsApp':'#25a35a','Ex-aluno':'#ca8a04' };\nconst RESPONSAVEIS = ['Ana Prado','Bruno Lima','Carla Menezes'];\nconst CURSOS = ['Inglês','Espanhol','Francês','Alemão','Italiano'];\nconst MOTIVOS = ['Não atende','Sem interesse','Preço','Mudança','Escolheu concorrente','Sem retorno'];\n\nconst PRIORIDADES = ['Alta','Média','Baixa'];\nconst VISITA_TIPOS = ['Visita','Ligação','Reunião','WhatsApp','E-mail'];\nfunction maskPhone(v){\n  const d = String(v||'').replace(/\\D/g,'').slice(0,15);\n  if(d.length > 11) return '+' + d;\n  if(d.length<=2) return d.length? '('+d : '';\n  if(d.length<=6) return '('+d.slice(0,2)+') '+d.slice(2);\n  if(d.length<=10) return '('+d.slice(0,2)+') '+d.slice(2,6)+'-'+d.slice(6);\n  return '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7);\n}\nfunction phoneDigits(v){ return String(v||'').replace(/\\D/g,''); }\nfunction waLink(tel){\n  const d = String(tel||'').replace(/\\D/g,'');\n  if(d.length < 8) return null;\n  const num = (d.length === 10 || d.length === 11) ? '55' + d : d;\n  return 'https://wa.me/' + num;\n}\nfunction pad(n){ return String(n).padStart(2,'0'); }\nfunction ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }\n// datetime-local <-> banco, sempre no fuso de Recife (-03:00)\nfunction dtLocalFromISO(s){\n  if(!s) return '';\n  const d = new Date(s); if(isNaN(d)) return '';\n  const rec = new Date(d.getTime() + (d.getTimezoneOffset()*60000) - (3*3600000));\n  return rec.getFullYear()+'-'+pad(rec.getMonth()+1)+'-'+pad(rec.getDate())+'T'+pad(rec.getHours())+':'+pad(rec.getMinutes());\n}\nfunction dtLocalNow(){ return dtLocalFromISO(new Date().toISOString()); }\nfunction dtLocalToISO(v){ return v ? v+':00-03:00' : null; }\nfunction offsetDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return d; }\nfunction addDaysStr(s, n){ const m=/^(\\d{4})-(\\d{2})-(\\d{2})$/.exec(s); const d = m ? new Date(Number(m[1]),Number(m[2])-1,Number(m[3])) : new Date(s); d.setDate(d.getDate()+n); return d; }\nfunction fmtRelative(s){\n  if(!s) return '';\n  const d = new Date(s); if(isNaN(d)) return String(s);\n  const now = new Date();\n  const hh = pad(d.getHours())+':'+pad(d.getMinutes());\n  const startToday = new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();\n  const startThat = new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();\n  const diffDays = Math.round((startToday-startThat)/86400000);\n  if(diffDays<=0) return 'hoje '+hh;\n  if(diffDays===1) return 'ontem '+hh;\n  return diffDays+' dias atrás';\n}\n\nclass Component extends DCLogic {\n  state = {\n    booting:true, session:null, authEmail:'', authPassword:'', authError:'', authLoading:false,\n    view:'dashboard', leads:[],\n    lists:{ fontes:FONTES, cursos:CURSOS, responsaveis:RESPONSAVEIS, motivos:MOTIVOS },\n    faixas:[],\n    statuses:STATUSES,\n    loading:false, toast:null,\n    search:'', fFonte:'', fStatus:'', fResp:'', fCurso:'',\n    ficha:null, fichaHist:[], fichaLoading:false,\n    formOpen:false, form:null, editingId:null, saving:false,\n    draggingId:null, dragOverStatus:null,\n    reg:null,\n    relPeriod:'hoje', rel:null, relLoading:false,\n    mural:[], muralLoading:false, equipe:[], isSupervisor:false, meuNome:'',\n    instTipos:[], instSituacoes:[], instituicoes:[], instLoading:false,\n    instBusca:'', instTipo:'', instSituacao:'', instPrioridade:'', instResp:'',\n    instForm:null, instEditingId:null, instSaving:false,\n    instFicha:null, instFichaRow:null, instVisitas:[], instVisitasLoading:false, visita:null, visitaSaving:false, instOpcoes:[],\n    repique:false,\n    muralPessoa:'', muralSituacao:'Abertas',\n    tarefaForm:null, tarefaEditingId:null, tarefaSaving:false,\n    remarcar:null, remarcarLog:[], remarcarSaving:false,\n    tarefaDelId:null, maisOpen:false,\n    isMobile: (typeof window!=='undefined' && window.matchMedia) ? window.matchMedia('(max-width:768px)').matches : false,\n    sheet:null,\n  };\n  chartRef = React.createRef();\n  chartRef2 = React.createRef();\n  copyFallbackRef = React.createRef();\n\n  componentDidMount(){\n    try { document.title = 'CRM Wizard Piedade'; } catch(e){}\n    this._setFavicon();\n    let sess=null; try { sess = JSON.parse(localStorage.getItem(SESSION_KEY)); } catch(e){}\n    if(sess && sess.refresh_token){ this.setState({ session:sess, booting:false }, ()=> this.loadInitial()); }\n    else { this.setState({ booting:false }); }\n    if(window.matchMedia){\n      this._mq = window.matchMedia('(max-width:768px)');\n      this._mqL = (e)=> this.setState({ isMobile:e.matches });\n      if(this._mq.addEventListener) this._mq.addEventListener('change', this._mqL);\n      else if(this._mq.addListener) this._mq.addListener(this._mqL);\n    }\n  }\n  _setFavicon(){\n    try {\n      const link = document.getElementById('favicon');\n      if(!link) return;\n      const pick = ()=> (document.querySelector('img[alt=\"Wizard\"]')||{}).src;\n      const build = (src)=>{\n        if(!src) return;\n        const img = new Image();\n        img.onload = ()=>{\n          try {\n            const c = document.createElement('canvas'); c.width=64; c.height=64;\n            const ctx = c.getContext('2d');\n            const r = Math.min(64/img.width, 64/img.height);\n            const w = img.width*r, h = img.height*r;\n            ctx.drawImage(img, (64-w)/2, (64-h)/2, w, h);\n            link.href = c.toDataURL('image/png');\n          } catch(e){ link.href = src; }\n        };\n        img.onerror = ()=>{ link.href = src; };\n        img.src = src;\n      };\n      let src = pick();\n      if(src) build(src);\n      else setTimeout(()=> build(pick()), 400);\n    } catch(e){}\n  }\n  componentWillUnmount(){\n    if(this._mq){ if(this._mq.removeEventListener) this._mq.removeEventListener('change', this._mqL); else if(this._mq.removeListener) this._mq.removeListener(this._mqL); }\n  }\n  componentDidUpdate(){ this._drawSoon(); }\n\n  // ---------------- auth ----------------\n  async sbAuth(grant, body){\n    const res = await fetch(SB_URL+'/auth/v1/token?grant_type='+grant, {\n      method:'POST', headers:{ 'apikey':SB_KEY, 'Content-Type':'application/json' }, body:JSON.stringify(body) });\n    const j = await res.json().catch(()=>({}));\n    if(!res.ok) throw new Error(j.error_description || j.msg || j.message || 'Falha na autenticação.');\n    return j;\n  }\n  _storeSession(j){\n    const sess = { access_token:j.access_token, refresh_token:j.refresh_token, user:j.user,\n      expiresAt: Date.now() + ((j.expires_in||3600)*1000) };\n    try { localStorage.setItem(SESSION_KEY, JSON.stringify(sess)); } catch(e){}\n    return sess;\n  }\n  setAuthEmail = e => this.setState({ authEmail:e.target.value });\n  setAuthPassword = e => this.setState({ authPassword:e.target.value });\n  onAuthKey = e => { if(e.key==='Enter') this.login(); };\n  login = async () => {\n    const email = (this.state.authEmail||'').trim(), pw = this.state.authPassword||'';\n    if(!email || !pw){ this.setState({ authError:'Informe e-mail e senha.' }); return; }\n    this.setState({ authLoading:true, authError:'' });\n    try {\n      const j = await this.sbAuth('password', { email, password:pw });\n      const sess = this._storeSession(j);\n      this.setState({ session:sess, authLoading:false, authPassword:'' }, ()=> this.loadInitial());\n    } catch(e){ this.setState({ authLoading:false, authError:'E-mail ou senha inválidos.' }); }\n  };\n  logout = () => {\n    try { localStorage.removeItem(SESSION_KEY); } catch(e){}\n    this.setState({ session:null, leads:[], ficha:null, formOpen:false, view:'dashboard', authPassword:'' });\n  };\n\n  async ensureToken(){\n    const s = this.state.session;\n    if(!s) throw new Error('no-session');\n    if(Date.now() < (s.expiresAt - 60000)) return s.access_token;\n    const j = await this.sbAuth('refresh_token', { refresh_token:s.refresh_token });\n    const sess = this._storeSession(j);\n    await new Promise(r=> this.setState({ session:sess }, r));\n    return sess.access_token;\n  }\n  async _fetch(path, opts, token){\n    const headers = Object.assign({ 'apikey':SB_KEY, 'Authorization':'Bearer '+token, 'Content-Type':'application/json' }, opts.headers||{});\n    return fetch(SB_URL+'/rest/v1/'+path, { method:opts.method||'GET', headers, body: opts.body!=null? JSON.stringify(opts.body): undefined });\n  }\n  async api(path, opts){\n    opts = opts||{};\n    let token;\n    try { token = await this.ensureToken(); }\n    catch(e){ this.logout(); throw new Error('Sua sessão expirou. Entre novamente.'); }\n    let res = await this._fetch(path, opts, token);\n    if(res.status===401){\n      try {\n        const j = await this.sbAuth('refresh_token', { refresh_token:this.state.session.refresh_token });\n        const sess = this._storeSession(j);\n        await new Promise(r=> this.setState({ session:sess }, r));\n        res = await this._fetch(path, opts, sess.access_token);\n      } catch(e){ this.logout(); throw new Error('Sua sessão expirou. Entre novamente.'); }\n    }\n    if(!res.ok){\n      const j = await res.json().catch(()=>({}));\n      const code = j.code || '';\n      let msg = j.message || j.hint || j.details || 'Erro ao comunicar com o servidor.';\n      if(code==='23505') msg = 'Já existe um lead com esse telefone.';\n      else if(code==='23514') msg = 'Dados recusados pelo banco: verifique status e motivo da perda.';\n      const err = new Error(msg); err.code = code; throw err;\n    }\n    if(res.status===204) return null;\n    const txt = await res.text(); return txt ? JSON.parse(txt) : null;\n  }\n  toast(msg, type){\n    this.setState({ toast:{ msg, type:type||'error' } });\n    clearTimeout(this._toastT);\n    this._toastT = setTimeout(()=> this.setState({ toast:null }), 4200);\n  }\n\n  // ---------------- data ----------------\n  async loadInitial(){\n    this.setState({ loading:true });\n    try { await Promise.all([ this.loadLists(), this.loadStatuses(), this.loadFaixas(), this.loadLeads(), this.loadMural(), this.loadEquipe(), this.loadSupervisor(), this.loadInstListas(), this.loadInstituicoes() ]); }\n    catch(e){ this.toast(e.message); }\n    finally { this.setState({ loading:false }); }\n  }\n  async loadMural(){\n    this.setState({ muralLoading:true });\n    try {\n      const rows = await this.api('vw_mural?select=*&order=prazo.asc');\n      this.setState({ mural:rows||[], muralLoading:false });\n    } catch(e){ this.setState({ muralLoading:false }); this.toast(e.message); }\n  }\n  async loadEquipe(){\n    try {\n      const rows = await this.api('vw_equipe?select=nome&order=nome');\n      const nomes = (rows||[]).map(x=>x.nome).filter(Boolean);\n      if(nomes.length) this.setState({ equipe:nomes });\n      else this.setState({ equipe:this.state.lists.responsaveis });\n    } catch(e){ this.setState({ equipe:this.state.lists.responsaveis }); }\n  }\n  async loadSupervisor(){\n    try {\n      const uid = this.state.session && this.state.session.user && this.state.session.user.id;\n      if(!uid) return;\n      const rows = await this.api('responsaveis?select=nome,supervisor&authId=eq.'+uid);\n      this.setState({ isSupervisor: !!(rows && rows[0] && rows[0].supervisor), meuNome: (rows && rows[0] && rows[0].nome) || '' });\n    } catch(e){ /* silencioso */ }\n  }\n  async loadLists(){\n    try {\n      const [f,c,r,m] = await Promise.all([\n        this.api('fontes?select=nome&ativo=is.true&order=ordem'),\n        this.api('cursos?select=nome,publico&ativo=is.true&order=ordem'),\n        this.api('responsaveis?select=nome&ativo=is.true&order=nome'),\n        this.api('motivos_perda?select=nome&order=ordem'),\n      ]);\n      this.setState({ lists:{\n        fontes: (f&&f.length)? f.map(x=>x.nome) : FONTES,\n        cursos: (c&&c.length)? Array.from(new Set(c.map(x=>x.nome))) : CURSOS,\n        responsaveis: (r&&r.length)? r.map(x=>x.nome) : RESPONSAVEIS,\n        motivos: (m&&m.length)? m.map(x=>x.nome) : MOTIVOS,\n      } });\n    } catch(e){ /* mantém listas padrão */ }\n  }\n  async loadStatuses(){\n    try {\n      const rows = await this.api('vw_funil?select=status,ordem&order=ordem');\n      const st = (rows||[]).map(x=>x.status).filter(Boolean);\n      if(st.length) this.setState({ statuses:st });\n    } catch(e){ /* mantém etapas padrão */ }\n  }\n  async loadFaixas(){\n    try {\n      const rows = await this.api('vw_faixas?select=*');\n      if(rows && rows.length) this.setState({ faixas:rows });\n    } catch(e){ /* sem faixas: etiqueta não aparece */ }\n  }\n  async loadLeads(){\n    const rows = await this.api('leads?select=*&order=dataEntrada.desc');\n    const leads = (rows||[]).map(l=> Object.assign({ email:'', motivoPerda:'', observacoes:'', tentativas:0 }, l));\n    this.setState({ leads });\n  }\n\n  _drawSoon(){\n    if(!this.state.session || this.state.view!=='dashboard' || !window.Chart) return;\n    this._donut(this.chartRef, this.state.leads.filter(l=>l.status==='Matriculado'), 'matr');\n    this._donut(this.chartRef2, this.state.leads, 'all');\n  }\n  _donut(ref, source, key){\n    const el = ref.current; if(!el) return;\n    const by = {}; source.forEach(l=> by[l.fonte]=(by[l.fonte]||0)+1);\n    const labels = Object.keys(by);\n    const vals = labels.map(k=>by[k]);\n    const colors = labels.map(k=>FONTE_COLOR[k]||'#94a3b8');\n    const sig = labels.join(',')+'|'+vals.join(',');\n    if(this['_c_'+key] && this['_el_'+key]===el && this['_sig_'+key]===sig) return;\n    this['_el_'+key] = el;\n    this['_sig_'+key] = sig;\n    if(this['_c_'+key]){ this['_c_'+key].destroy(); this['_c_'+key]=null; }\n    if(!labels.length) return;\n    this['_c_'+key] = new window.Chart(el, {\n      type:'doughnut',\n      data:{ labels, datasets:[{ data:vals, backgroundColor:colors, borderWidth:2, borderColor:'#fff' }] },\n      options:{ responsive:true, maintainAspectRatio:false, cutout:'62%',\n        plugins:{ legend:{ position:'bottom', labels:{ boxWidth:12, padding:14, font:{ size:12, family:'Helvetica Neue' } } } } }\n    });\n  }\n\n  go(v){ return ()=>{ this.setState({ view:v, ficha:null, formOpen:false, maisOpen:false }); if(v==='relatorios') this.loadRel(); if(v==='mural') this.loadMural(); if(v==='comercial') this.loadInstituicoes(); }; }\n\n  // ---------------- comercial ----------------\n  async loadInstListas(){\n    try {\n      const [t,s] = await Promise.all([\n        this.api('inst_tipos?select=nome&ativo=eq.true&order=ordem'),\n        this.api('inst_situacoes?select=nome&ativo=eq.true&order=ordem'),\n      ]);\n      this.setState({ instTipos:(t||[]).map(x=>x.nome).filter(Boolean), instSituacoes:(s||[]).map(x=>x.nome).filter(Boolean) });\n    } catch(e){ /* menus vazios: nao quebra a aba */ }\n  }\n  async loadInstituicoes(){\n    this.setState({ instLoading:true });\n    try {\n      const rows = await this.api('vw_rel_instituicoes?select=*&order=nome.asc');\n      this.setState({ instituicoes:rows||[], instLoading:false });\n      this.api('instituicoes?select=id,nome&order=nome.asc').then(o=> this.setState({ instOpcoes:o||[] })).catch(()=>{});\n    } catch(e){ this.setState({ instLoading:false }); this.toast(e.message); }\n  }\n  openInstFicha(id){ return ()=>{\n    this.setState({ instFicha:id, instFichaRow:null });\n    this.api('instituicoes?id=eq.'+id+'&select=*')\n      .then(r=>{ if(this.state.instFicha===id) this.setState({ instFichaRow:(r&&r[0])||null }); })\n      .catch(e=> this.toast(e.message));\n    this._loadVisitas(id);\n  }; }\n  closeInstFicha = () => this.setState({ instFicha:null, instFichaRow:null });\n  _loadVisitas(id){\n    this.setState({ instVisitasLoading:true, instVisitas:[] });\n    this.api('visitas?instituicaoId=eq.'+id+'&select=*&order=data.desc')\n      .then(r=> this.setState({ instVisitas:r||[], instVisitasLoading:false }))\n      .catch(e=>{ this.setState({ instVisitasLoading:false }); this.toast(e.message); });\n  }\n  openEditInst(id){ return async ()=>{\n    try {\n      const rows = await this.api('instituicoes?id=eq.'+id+'&select=*');\n      const i = rows && rows[0]; if(!i){ this.toast('Instituição não encontrada.'); return; }\n      this.setState({ instFicha:null, instEditingId:id, instForm:{ nome:i.nome||'', tipo:i.tipo||'', cnpj:i.cnpj||'', bairro:i.bairro||'', endereco:i.endereco||'',\n        contato:i.contato||'', cargo:i.cargo||'', telefone:i.telefone||'', email:i.email||'', responsavel:i.responsavel||'',\n        prioridade:i.prioridade||PRIORIDADES[1], situacao:i.situacao||'', observacoes:i.observacoes||'' } });\n    } catch(e){ this.toast(e.message); }\n  }; }\n  deleteInst(id){ return async ()=>{ if(!confirm('Excluir esta instituição? O histórico de visitas vai junto.')) return;\n    try { await this.api('instituicoes?id=eq.'+id, { method:'DELETE' }); this.setState({ instFicha:null }); await this.loadInstituicoes(); this.toast('Instituição excluída.', 'ok'); }\n    catch(e){ this.toast(e.message); }\n  }; }\n  openVisita(id){ return ()=> this.setState({ visita:{ instituicaoId:id, tipo:VISITA_TIPOS[0], data:dtLocalNow(), relato:'', proximoPasso:'', proximaData:'' } }); }\n  closeVisita = () => this.setState({ visita:null });\n  vset = k => e => { const v=e.target.value; this.setState(s=>({ visita:Object.assign({}, s.visita, { [k]:v }) })); };\n  saveVisita = async () => {\n    const v = this.state.visita; if(!v) return;\n    if(!v.relato || !v.relato.trim()){ this.toast('Escreva o relato da visita.'); return; }\n    this.setState({ visitaSaving:true });\n    try {\n      await this.api('visitas', { method:'POST', body:{ instituicaoId:v.instituicaoId, data:dtLocalToISO(v.data), autor:(this.state.meuNome||''),\n        tipo:v.tipo, relato:v.relato.trim(), proximoPasso:v.proximoPasso||'', proximaData:v.proximaData||null } });\n      const fid = this.state.instFicha;\n      await this.loadInstituicoes();\n      if(fid) this._loadVisitas(fid);\n      this.setState({ visita:null, visitaSaving:false });\n      this.toast('Visita registrada.', 'ok');\n    } catch(e){ this.setState({ visitaSaving:false }); this.toast(e.message); }\n  };\n  setInstBusca = e => this.setState({ instBusca:e.target.value });\n  setInstTipo = e => this.setState({ instTipo:e.target.value });\n  setInstSituacao = e => this.setState({ instSituacao:e.target.value });\n  setInstPrioridade = e => this.setState({ instPrioridade:e.target.value });\n  setInstResp = e => this.setState({ instResp:e.target.value });\n  clearInstFilters = () => this.setState({ instBusca:'', instTipo:'', instSituacao:'', instPrioridade:'', instResp:'' });\n  openNovaInst = () => this.setState({ instForm:{ nome:'', tipo:(this.state.instTipos[0]||''), cnpj:'', bairro:'', endereco:'', contato:'', cargo:'', telefone:'', email:'', responsavel:(this.state.meuNome||this.state.equipe[0]||''), prioridade:PRIORIDADES[1], situacao:(this.state.instSituacoes[0]||''), observacoes:'' }, instEditingId:null });\n  closeInstForm = () => this.setState({ instForm:null, instEditingId:null });\n  ifset = k => e => { const v = k==='telefone' ? maskPhone(e.target.value) : e.target.value; this.setState(s=>({ instForm:Object.assign({}, s.instForm, { [k]:v }) })); };\n  saveInst = async () => {\n    const f = thi imoContato||0); par+=Number(r.parados3dias||0); });\n    out.push('*Situação da carteira*');\n    if(fila===0 && semP===0 && par===0) out.push('Carteira em dia.');\n    else out.push('Fila vencida: '+fila+' · Sem próximo contato: '+semP+' · Parados +3 dias: '+par);\n    out.push('');\n    // Resultado\n    const CF = ['entraram','contatosRegistrados','movimentacoes','aulasAgendadas','compareceram','matriculas','perdas'];\n    const sc={}; CF.forEach(f=>sc[f]=0);\n    (R.resu||[]).forEach(r=> CF.forEach(f=> sc[f]+= Number(r[f]||0)));\n    out.push('*Resultado do período*');\n    out.push('Entraram '+sc.entraram+' · Contatos '+sc.contatosRegistrados+' · Aulas agendadas '+sc.aulasAgendadas+' · Compareceram '+sc.compareceram+' · Matrículas '+sc.matriculas+' · Perdas '+sc.perdas);\n    const mot = (R.mot||[]).filter(m=> Number(m.total||0)>0);\n    if(mot.length) out.push('Motivos de perda: '+mot.map(m=> m.motivo+' '+Number(m.total||0)).join(' · '));\n    return out.join('\\n');\n  }\n  copyResumo = async () => {\n    const txt = this._buildResumo();\n    if(!txt) return;\n    try {\n      await navigator.clipboard.writeText(txt);\n      this.toast('Resumo copiado. É só colar no WhatsApp.', 'ok');\n    } catch(e){ this.setState({ copyFallback:txt }, ()=>{ setTimeout(()=>{ const el=this.copyFallbackRef.current; if(el){ el.focus(); el.select(); } }, 60); }); }\n  };\n  _buildResumoDia(){\n    const S = this.state, leads = S.leads||[];\n    const snap = this._diaSnap || { hoje:0, parados:0, novos:0, atrasados:0, maisAntigo:0 };\n    const DIAS = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];\n    const now = new Date();\n    const head = '*WIZARD PIEDADE — '+DIAS[now.getDay()]+', '+pad(now.getDate())+'/'+pad(now.getMonth()+1)+'*';\n    const L = [];\n\n    const op = [];\n    if(snap.hoje) op.push('• '+this._plur(snap.hoje,'lead para contatar hoje','leads para contatar hoje'));\n    if(snap.atrasados) op.push('• '+snap.atrasados+' atrasados, o mais antigo
